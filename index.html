<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaixCam 上位机</title>
<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
        --bg:#0d0d12;--surface:#14141c;--border:#2a2a36;
        --accent:#00c8ff;--text:#dcdce0;--dim:#8888a0;
        --green:#3deb6b;--red:#ff4444;--orange:#ff8c3a;
    }
    body{
        background:var(--bg);
        color:var(--text);
        font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        min-height:100vh;overflow:hidden;
        user-select:none;-webkit-user-select:none;
    }
    .container{
        display:flex;flex-direction:column;align-items:center;
        width:100%;max-width:900px;padding:0 16px;
    }
    .header{
        padding:14px 4px;
        display:flex;align-items:center;gap:14px;
        width:100%;justify-content:space-between;
    }
    .title{font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.4px;}
    .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);}
    .dot{
        width:9px;height:9px;border-radius:50%;
        background:var(--red);transition:background .3s;
    }
    .dot.live{
        background:var(--green);
        animation:pulse 2.5s infinite;
    }
    @keyframes pulse{
        0%,100%{box-shadow:0 0 0 0 rgba(61,235,107,.45)}
        50%{box-shadow:0 0 0 10px rgba(61,235,107,0)}
    }
    .urlbar{
        width:100%;display:flex;gap:8px;padding:0 0 8px 0;
    }
    .urlbar input{
        flex:1;
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:6px;
        padding:10px 14px;
        color:var(--text);
        font-size:13px;font-family:inherit;
        outline:none;transition:border-color .2s;
    }
    .urlbar input:focus{border-color:var(--accent);}
    .urlbar input::placeholder{color:#555;}
    .urlbar button,.urlbar select{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:6px;
        padding:10px 16px;
        color:var(--text);
        font-size:13px;font-family:inherit;
        cursor:pointer;
        transition:border-color .2s,background .2s;
        white-space:nowrap;
    }
    .urlbar button:hover,.urlbar select:hover{border-color:var(--accent);}
    .urlbar button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
    .urlbar button.primary:hover{opacity:.85;}

    /* 录制栏 */
    .recbar{
        width:100%;display:flex;align-items:center;gap:10px;
        padding:6px 0;font-size:12px;color:var(--dim);
    }
    .recbar .rec-dot{
        width:10px;height:10px;border-radius:50%;
        background:var(--dim);
    }
    .recbar .rec-dot.active{
        background:var(--red);
        animation:recPulse 1s infinite;
    }
    @keyframes recPulse{
        0%,100%{opacity:1}50%{opacity:.3}
    }
    .recbar button{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:5px;padding:6px 14px;
        color:var(--text);font-size:12px;cursor:pointer;
        transition:border-color .2s;
    }
    .recbar button:hover{border-color:var(--accent);}
    .recbar button.rec-start{border-color:var(--red);color:var(--red);}
    .recbar button.rec-start:hover{background:var(--red);color:#fff;}
    .recbar button.rec-stop{border-color:var(--orange);color:var(--orange);}
    .recbar button.rec-stop:hover{background:var(--orange);color:#000;}

    .info{
        display:flex;gap:16px;font-size:12px;color:var(--dim);
        padding:4px 0;width:100%;
    }
    .info span{color:var(--text);font-weight:500;}
    .viewer{
        position:relative;width:100%;
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:10px;overflow:hidden;
        box-shadow:0 8px 32px rgba(0,0,0,.5);
        aspect-ratio:4/3;
    }
    .viewer img{display:block;width:100%;height:100%;object-fit:contain;}
    .viewer canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none;}
    .overlay{
        position:absolute;inset:0;
        display:flex;align-items:center;justify-content:center;
        pointer-events:none;transition:opacity .5s;
    }
    .overlay .msg{
        background:rgba(0,0,0,.78);color:var(--dim);
        padding:14px 32px;border-radius:8px;font-size:14px;
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    }
    .overlay.ok{opacity:0;}
    .hint{
        padding:10px;font-size:12px;color:#555;text-align:center;
        letter-spacing:.3px;
    }
    .hint span{color:var(--accent);}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="title">MaixCam 上位机</span>
        <div class="status">
            <div class="dot" id="dot"></div>
            <span id="statusText">等待推流…</span>
        </div>
    </div>

    <div class="urlbar">
        <select id="preset" title="快速切换">
            <option value="">⚡ 预设…</option>
            <option value="http://localhost:8080/stream">🖥 PC 代理</option>
            <option value="http://192.168.88.1:8000/stream">📡 MaixCam 直连</option>
        </select>
        <input id="urlInput" type="text" placeholder="流地址">
        <button class="primary" id="btnConnect">连接</button>
    </div>

    <div class="recbar">
        <div class="rec-dot" id="recDot"></div>
        <span id="recLabel">未录制</span>
        <span id="recDur" style="display:none">00:00</span>
        <span id="recSize" style="display:none"></span>
        <span style="flex:1"></span>
        <button class="rec-start" id="btnRecStart">● 开始录制</button>
        <button class="rec-stop" id="btnRecStop" style="display:none">■ 停止录制</button>
    </div>

    <div class="info">
        <div>状态: <span id="connInfo">--</span></div>
        <div>数据: <span id="dataInfo">--</span></div>
    </div>

    <div class="viewer" id="viewer">
        <img id="stream"
             src="http://localhost:8080/stream"
             alt="MJPEG Stream"
             onload="onFrame()"
             onerror="onErr()"
             crossorigin="anonymous"
             referrerpolicy="no-referrer">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
            <div class="msg">等待视频流…</div>
        </div>
    </div>
    <div class="hint">双击画面 <span>切换全屏</span> · 点击 <span>开始录制</span> 保存视频</div>
</div>
<script>
    const img       = document.getElementById('stream');
    const dot       = document.getElementById('dot');
    const st        = document.getElementById('statusText');
    const overlay   = document.getElementById('overlay');
    const viewer    = document.getElementById('viewer');
    const urlInp    = document.getElementById('urlInput');
    const preset    = document.getElementById('preset');
    const btnConn   = document.getElementById('btnConnect');
    const connEl    = document.getElementById('connInfo');
    const dataEl    = document.getElementById('dataInfo');
    const recDot    = document.getElementById('recDot');
    const recLabel  = document.getElementById('recLabel');
    const recDur    = document.getElementById('recDur');
    const recSize   = document.getElementById('recSize');
    const btnStart  = document.getElementById('btnRecStart');
    const btnStop   = document.getElementById('btnRecStop');

    const DEFAULT_URL  = 'http://localhost:8080/stream';
    const STORAGE_KEY  = 'maixcam_stream_url';

    let alive = false;
    let retryTimer = null;
    let currentUrl = '';
    let recording = false;
    let recorder = null;
    let recStream = null;
    let recChunks = [];
    let recStartTime = null;
    let recTimer = null;
    let drawLoop = null;
    let healthUrl = 'http://localhost:8080/health';

    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');

    // ── 初始化 ──
    function init() {
        var saved = localStorage.getItem(STORAGE_KEY);
        currentUrl = saved || DEFAULT_URL;
        urlInp.value = currentUrl;
        img.src = currentUrl;
    }

    // ── 连接 ──
    function connect(url) {
        url = url || urlInp.value.trim();
        if (!url) return;
        if (url === currentUrl) {
            img.src = url.replace(/\?.*$/, '') + '?' + Date.now();
        } else {
            currentUrl = url;
            urlInp.value = url;
            localStorage.setItem(STORAGE_KEY, url);
            img.src = url;
        }
        // 推断 health URL
        var idx = url.lastIndexOf('/');
        healthUrl = idx > 0 ? url.substring(0, idx) + '/health' : 'http://localhost:8080/health';
        alive = false;
        dot.className = 'dot';
        st.textContent = '连接中…';
        overlay.classList.remove('ok');
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        // 切换代理后重置录制状态
        if (url.indexOf('localhost:8080') < 0) {
            recording = false;
            updateRecUI();
        }
    }

    btnConn.addEventListener('click', function() { connect(); });
    urlInp.addEventListener('keydown', function(e) { if (e.key === 'Enter') connect(); });
    preset.addEventListener('change', function() {
        if (this.value) { urlInp.value = this.value; connect(this.value); this.value = ''; }
    });

    // ── 录制 ──
    function updateRecUI() {
        if (recording) {
            recDot.classList.add('active');
            recLabel.textContent = '录制中';
            recDur.style.display = '';
            recSize.style.display = '';
            btnStart.style.display = 'none';
            btnStop.style.display = '';
        } else {
            recDot.classList.remove('active');
            recLabel.textContent = '未录制';
            recDur.style.display = 'none';
            recSize.style.display = 'none';
            btnStart.style.display = '';
            btnStop.style.display = 'none';
        }
    }

    // ── 开始录制（Canvas + MediaRecorder）──
    btnStart.addEventListener('click', function() {
        if (recording) return;
        if (!alive) { alert('请等待视频流连接后再录制'); return; }

        canvas.width = img.naturalWidth || 640;
        canvas.height = img.naturalHeight || 480;
        canvas.style.display = 'block';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        drawLoop = setInterval(function() {
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
        }, 33);

        recStream = canvas.captureStream(30);
        var mime = 'video/webm; codecs=vp8';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
        recorder = new MediaRecorder(recStream, { mimeType: mime, videoBitsPerSecond: 2500000 });
        recChunks = [];

        recorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) recChunks.push(e.data);
        };
        recorder.onstop = function() {
            var blob = new Blob(recChunks, { type: mime });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            var ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
            a.href = url; a.download = 'record_' + ts + '.webm';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        recorder.start(1000);
        recording = true;
        recStartTime = Date.now();
        updateRecUI();
    });

    // ── 停止录制 ──
    btnStop.addEventListener('click', function() {
        if (!recording) return;
        recording = false;
        if (drawLoop) { clearInterval(drawLoop); drawLoop = null; }
        if (recorder && recorder.state === 'recording') recorder.stop();
        if (recStream) { recStream.getTracks().forEach(function(t) { t.stop(); }); recStream = null; }
        canvas.style.display = 'none';
        updateRecUI();
    });

    // 录制计时
    setInterval(function() {
        if (!recording || !recStartTime) return;
        var s = Math.floor((Date.now() - recStartTime)/1000);
        var m = Math.floor(s/60); s = s%60;
        recDur.textContent = (m<10?'0'+m:m) + ':' + (s<10?'0'+s:s);
    }, 500);

    // ── 流回调 ──
    function onFrame() {
        if (!alive) {
            alive = true;
            dot.className = 'dot live';
            st.textContent = '推流中';
            overlay.classList.add('ok');
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        }
    }

    function onErr() {
        alive = false;
        dot.className = 'dot';
        st.textContent = '等待推流…';
        overlay.classList.remove('ok');
        scheduleRetry();
    }

    function scheduleRetry() {
        if (retryTimer) return;
        retryTimer = setTimeout(function() {
            retryTimer = null;
            img.src = currentUrl.replace(/\?.*$/, '') + '?' + Date.now();
        }, 2000);
    }

    viewer.addEventListener('dblclick', function() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (viewer.requestFullscreen) viewer.requestFullscreen();
    });

    // ── 定时拉取健康数据 ──
    setInterval(function() {
        if (alive) { alive = false; }
        else if (dot.classList.contains('live')) {
            dot.className = 'dot';
            st.textContent = '重新连接…';
        }
        fetch(healthUrl).then(function(r){return r.json()}).then(function(d){
            connEl.textContent = d.connected ? '已连接' : '--';
            var mb = d.proxy_bytes ? (d.proxy_bytes/1024/1024).toFixed(1) + ' MB' : '--';
            dataEl.textContent = mb;
        }).catch(function(){});
    }, 3000);

    init();
</script>
</body>
</html>
